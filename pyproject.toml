[project]
name = "nonebot-plugin-shitbot"
version = "0.4.2"
description = "NoneBot shitpost plugin"
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-htmlrender>=0.6.7",
    "fastapi>=0.100",
    "nonebot-plugin-localstore>=0.3.0",
    "PixivPy-Async>=1.2.14",
    "Pillow>=12.2.0",
    "httpx>=0.28.1",
    "python-magic>=0.4",
    "pydantic>=2",
    "PyYAML>=6.0.3",
    "ruamel.yaml>=0.18.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.setuptools.packages.find]
where = ["."]
include = ["nonebot_plugin_shitbot*"]

[tool.setuptools.package-data]
"nonebot_plugin_shitbot" = [
    "css/*.css",
    "*.yaml",
    "help/**/*",
]

[tool.nonebot.plugins]
nonebot-plugin-shitbot = ["nonebot_plugin_shitbot"]
nonebot-plugin-htmlrender = ["nonebot_plugin_htmlrender"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
