[project]
name = "nonebot-plugin-shitbot"
version = "1.0.1"
description = "NoneBot shitpost plugin"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "nonebot2>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "fastapi>=0.100",
    "nonebot-plugin-localstore>=0.3.0",
    "PixivPy-Async>=1.2.14",
    "yt-dlp>=2026.10.21",
    "Pillow>=12.2.0",
    "httpx>=0.28.1",
    "python-magic>=0.4; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "pydantic>=2",
    "PyYAML>=6.0.3",
    "ruamel.yaml>=0.18.0",
    "markdown>=3.6",
    "pymdown-extensions>=10.0",
    "pygments>=2.14",
    "playwright>=1.48.0",
    "nh3>=0.2",
    "biliass>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "nonebug>=0.4.4",
    "pyright>=1.1.409",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.setuptools.packages.find]
where = ["."]
include = ["nonebot_plugin_shitbot*"]

[tool.setuptools.package-data]
"nonebot_plugin_shitbot" = [
    "markdown/**/*",
    "*.yaml",
    "help/**/*",
]

[tool.nonebot.plugins]
nonebot-plugin-shitbot = ["nonebot_plugin_shitbot"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
